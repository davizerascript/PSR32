# PSR32 RGA-safe performance test configuration.
# Native framebuffer size is intentional: the R36S log showed RGA blit
# failures with a source rectangle whose width and height were both zero.
# This file does not modify the user's global retrorun configuration.

retrorun_fps_counter = true
retrorun_aspect_ratio = 4:3
retrorun_loop_60_fps = false
ps2.limitframerate = 30
renderer.opengl.resfactor = 1.0
play_res_multi = 1.0x
play_presentation_mode = Fit Screen
play_bilinear_filtering = false
