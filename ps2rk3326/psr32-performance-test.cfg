# PSR32 experimental performance test configuration.
# This file is selected only by the test launcher; it does not modify the
# user's global retrorun/RetroArch configuration.

# Retrorun overlay.
retrorun_fps_counter = true
retrorun_aspect_ratio = 4:3
retrorun_loop_60_fps = false

# PSR32 / Play! core options exposed by the supplied ARM64 core.
# The core's frame limiter consumes the requested target when supported.
ps2.limitframerate = 30
renderer.opengl.resfactor = 0.5
play_res_multi = 0.5x
play_presentation_mode = Fit Screen
play_bilinear_filtering = false
